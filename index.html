<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="ApplyAI"/>
  <meta name="theme-color" content="#040d1a"/>
  <meta name="description" content="Tailor your resume and cover letter for any job in seconds"/>
  <title>ApplyAI</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-512.png"/>
  <link rel="icon" href="icon-192.png"/>
  <style>
    html,body,#root{margin:0;padding:0;width:100%;min-height:100%;background:#040d1a;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);}
    #splash{position:fixed;inset:0;background:#040d1a;display:flex;flex-direction:column;
      align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s;}
    #splash.hide{opacity:0;pointer-events:none;}
    #splash-icon{width:72px;height:72px;border-radius:18px;
      background:linear-gradient(135deg,#3b82f6,#8b5cf6);
      display:flex;align-items:center;justify-content:center;
      font-size:34px;margin-bottom:18px;
      animation:splashPulse 1.5s ease-in-out infinite;}
    #splash h1{font-family:system-ui,sans-serif;font-size:28px;font-weight:800;
      color:#e2e8f0;margin:0 0 6px;letter-spacing:-0.02em;}
    #splash p{font-family:monospace;color:#475569;font-size:12px;margin:0;}
    #install-banner{position:fixed;bottom:16px;left:16px;right:16px;
      background:#0d1f38;border:1px solid #1e3a5f;border-radius:12px;
      padding:14px 16px;display:none;align-items:center;gap:12px;
      z-index:500;box-shadow:0 8px 32px #00000088;}
    #install-banner.show{display:flex;}
    #install-banner span{flex:1;font-family:monospace;font-size:12px;color:#94a3b8;}
    #install-btn{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;
      border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;
      cursor:pointer;font-family:monospace;white-space:nowrap;}
    #dismiss-btn{background:transparent;border:none;color:#475569;font-size:18px;
      cursor:pointer;padding:0 4px;line-height:1;}
    #offline-bar{display:none;position:fixed;top:0;left:0;right:0;
      background:#7f1d1d;color:#fca5a5;text-align:center;
      font-family:monospace;font-size:12px;padding:6px;z-index:1000;}
    #offline-bar.show{display:block;}
    @keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  </style>
</head>
<body>
<div id="offline-bar">📡 You're offline — previously loaded content still works</div>
<div id="splash">
  <div id="splash-icon">✦</div>
  <h1>ApplyAI</h1>
  <p>Loading…</p>
</div>
<div id="root"></div>
<div id="install-banner">
  <span>📲 Install ApplyAI on your home screen</span>
  <button id="install-btn">Install</button>
  <button id="dismiss-btn">✕</button>
</div>

<script>
// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(() => {})
  );
}

// PWA install prompt
let deferredPrompt;
const banner = document.getElementById('install-banner');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  setTimeout(() => banner.classList.add('show'), 5000);
});
document.getElementById('install-btn').addEventListener('click', async () => {
  banner.classList.remove('show');
  if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
});
document.getElementById('dismiss-btn').addEventListener('click', () => banner.classList.remove('show'));
window.addEventListener('appinstalled', () => { banner.classList.remove('show'); deferredPrompt = null; });

// Offline detection
const offBar = document.getElementById('offline-bar');
function updateOnline() { offBar.classList.toggle('show', !navigator.onLine); }
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);
updateOnline();
</script>
